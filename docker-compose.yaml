services:
  api:
    image: ceyteq-api:local
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PROVIDER: mysql
      SERVER_DISABLE_MANAGER: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ceyteq_instances:/app/instances

  frontend:
    image: ceyteq-workspace:local
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CEYTEQ_API_URL: http://api:8080
      CEYTEQ_SESSION_SECRET: ${CEYTEQ_SESSION_SECRET:?Set CEYTEQ_SESSION_SECRET in .env}
    ports:
      - "3000:3000"

volumes:
  ceyteq_instances:
