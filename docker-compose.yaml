services:
  api:
    image: ceyteq-api:local
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PROVIDER: mysql
      SERVER_PORT: ${SERVER_PORT:-${PORT:-8080}}
      SERVER_DISABLE_MANAGER: "true"
    ports:
      - "127.0.0.1:${CEYTEQ_API_HOST_PORT:-8080}:${SERVER_PORT:-${PORT:-8080}}"
    volumes:
      - ceyteq_instances:/app/instances

  frontend:
    image: ceyteq-workspace:local
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CEYTEQ_API_URL: http://api:${SERVER_PORT:-${PORT:-8080}}
      CEYTEQ_SESSION_SECRET: ${CEYTEQ_SESSION_SECRET:?Set CEYTEQ_SESSION_SECRET in .env}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"

volumes:
  ceyteq_instances:
