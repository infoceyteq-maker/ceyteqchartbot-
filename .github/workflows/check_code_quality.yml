name: Ceyteq checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Generate MySQL Prisma client
        run: npm run db:generate
        env:
          DATABASE_PROVIDER: mysql
          DATABASE_CONNECTION_URI: mysql://user:pass@localhost:4000/ceyteq
      - name: Check API
        run: npm run lint:check && npm run build
      - name: Install and check workspace
        run: npm ci && npm run typecheck && npm run build && npm test
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
