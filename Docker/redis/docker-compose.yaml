version: '3.3'

services:
  redis:
    image: redis:latest
    networks:
      - ceyteq-net
    container_name: redis
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - ceyteq_redis:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  ceyteq_redis:


networks:
  ceyteq-net:
    name: ceyteq-net
    driver: bridge
